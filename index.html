<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Game Catalog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <div class="brand-title">GAME CATALOG</div>
        <div class="brand-subtitle">Моя коллекция игр</div>
      </div>
    </div>
    <a class="admin-link" href="admin.html">⚙ Управление</a>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">STEAM COLLECTION</p>
      <h1>Игры, которые стоит попробовать</h1>
      <p class="hero-text">Игры которые планирую купить.</p>
    </section>

    <section class="carousel-section">
      <button class="nav-arrow left" id="prevBtn" aria-label="Предыдущая игра">‹</button>
      <div class="carousel" id="carousel"></div>
      <button class="nav-arrow right" id="nextBtn" aria-label="Следующая игра">›</button>
    </section>

    <section class="game-details" id="gameDetails">
      <div class="empty-state">
        <div class="empty-icon">🎮</div>
        <h2>Пока нет игр</h2>
        <p>Открой раздел «Управление» и добавь первую игру.</p>
        <a class="primary-btn" href="admin.html">Добавить игру</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Локальный каталог игр</span>
    <span id="gameCounter"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
