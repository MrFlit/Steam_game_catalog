<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2aaeff"/>
      <stop offset="1" stop-color="#0b6ea8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5"
        fill="none" stroke="#66c0f4" stroke-opacity=".25"/>

  <text
    x="32"
    y="45"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="900"
    fill="#ffffff">S</text>
</svg>
